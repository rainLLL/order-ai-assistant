spring.application.name=order-ai-assistant
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY}
spring.ai.deepseek.base-url=https://api.deepseek.com
spring.ai.deepseek.chat.model=deepseek-flash
# spring.ai.deepseek.chat.thinking.type=disabled
spring.ai.deepseek.chat.max-tokens=512

spring.ai.retry.max-attempts=1

spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=60s

spring.ai.tools.limits.max-calls-per-tool-default=2
spring.ai.tools.limits.max-total-tool-calls=3
spring.ai.tools.limits.on-limit-exceeded=THROW

demo.current-user-id=1001

logging.pattern.level=%5p [requestId=%X{requestId}]
